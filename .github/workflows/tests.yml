name: Regression tests
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt pytest playwright
      - run: python -m compileall -q meditip main.py tests
      - run: node --check assets/editor.js
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          mkdir -p output
          status=0
          for test in tests/browser_*.py; do
            echo "::group::$test"
            python "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"
